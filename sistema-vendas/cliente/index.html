<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="../domain/Produto.js"></script>
    <script src="../domain/ItemCarrinho.js"></script>
    <script src="../domain/Carrinho.js"></script>
    <script src="../domain/Venda.js"></script>
    <title>HortiFruti Digital</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">HortiFruti Digital</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Voltar</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section>
            <form class="form" id="item-carrinho-form">
                <div class="mb-3">
                    <label for="item-carrinho" class="form-label">Produto</label>
                    <select class="form-select" id="item-carrinho" required value="select"></select>


                </div>
                <div class="mb-3">
                    <label for="preco-produto" class="form-label">Quantidade</label>
                    <input type="number" class="form-control" id="quantidade-item-carrinho" required>
                </div>

                <button type="submit" class="btn btn-primary">Adcionar ao carrinho</button>
            </form>
            </div>
            <div class="modal-footer">

                <table class="table">
                    <thead>
                        <th>Id Produto</th>
                        <th>Item</th>
                        <th>Quantidade</th>
                        <th>Subtotal</th>
                    </thead>

                    <tbody id="tabela-carrinho"></tbody>

                    <tfoot>
                        <th>Total</th>
                        <td id="total"></td>
                    </tfoot>

                </table>

                <button type="submit" class="btn btn-primary" id="finalizar-compra">Finalizar Compra</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </section>
    </main>
    <footer class="footer">HortiFruti</footer>

    <script src="./app.js"></script>

</body>

</html>
