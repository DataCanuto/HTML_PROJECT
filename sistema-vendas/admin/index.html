<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="../domain/Produto.js"></script>
    <script src="../domain/ItemCarrinho.js"></script>
    <script src="../domain/Carrinho.js"></script>
    <script src="../domain/Venda.js"></script>

    

</head>


<body>

    <header>
        <p><a href="../index.html">Voltar</a></p>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#produtosModal"
            text-center>Cadastrar Produto</button>

        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#carrinhoModal"
            text-center>Simular Compra</button>

    </header>

    <main>
        <section>
            <div class="accordion" id="accordionExample">
                <div class="accordion-item">
                    <h2 class="accordion-header" id="headingOne">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                            Produtos
                        </button>
                    </h2>
                    <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne"
                        data-bs-parent="#accordionExample">
                        <div class="accordion-body">
                            <table class="table">
                                <thead>
                                    <th>Id</th>
                                    <th>Nome</th>
                                    <th>Preço</th>
                                    <th>Estoque</th>
                                </thead>
                                <tbody id="tabela-produtos"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="accordion-item">
                    <h2 class="accordion-header" id="headingTwo">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                            Vendas
                        </button>
                    </h2>
                    <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo"
                        data-bs-parent="#accordionExample">
                        <div class="accordion-body">
                            <table class="table">
                                <thead>
                                    <th>Id Venda</th>
                                    <th>Data</th>
                                    <th>Valor Total</th>
                                    <th>Total Produtos Vendidos</th>
                                    <th>Detalhes da Venda</th>
                                </thead>

                                <tbody id="tabela-vendas"></tbody>
                                
                            </table>
                        </div>
                    </div>
                </div>
                
            </div>
        </section>










    </main>

    <footer></footer>

    <div class="modal" id="produtosModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cadastrar Produto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form class="form" id="produtos-form">
                        <div class="mb-3">
                            <label for="nome-produto" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome-produto" required>

                        </div>
                        <div class="mb-3">
                            <label for="preco-produto" class="form-label">Preço</label>
                            <input type="number" class="form-control" id="preco-produto" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label for="estoque-produto" class="form-label">Estoque</label>
                            <input type="number" class="form-control" id="estoque-produto" required>
                        </div>

                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>

                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="carrinhoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Adcionar Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form class="form" id="item-carrinho-form">
                        <div class="mb-3">
                            <label for="item-carrinho" class="form-label">Produto</label>
                            <select class="form-select" id="item-carrinho" required></select>


                        </div>
                        <div class="mb-3">
                            <label for="preco-produto" class="form-label">Quantidade</label>
                            <input type="number" class="form-control" id="quantidade-item-carrinho" required>
                        </div>

                        <button type="submit" class="btn btn-primary">Adcionar ao carrinho</button>
                    </form>
                </div>
                <div class="modal-footer">

                    <table class="table">
                        <thead>
                            <th>Id Produto</th>
                            <th>Item</th>
                            <th>Quantidade</th>
                            <th>Subtotal</th>
                        </thead>

                        <tbody id="tabela-carrinho"></tbody>

                        <tfoot>
                            <th>Total</th>
                            <td id="total"></td>
                        </tfoot>

                    </table>
                
                    <button type="submit" class="btn btn-primary" id="finalizar-compra">Finalizar Compra</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>

                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="detalhesVendaModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Detalhes da Venda</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <table class="table">
                    <thead>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Subtotal</th>
                    </thead>
                    <tbody id="tabela-detalhes-venda"></tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>

    <script src="./app.js"></script>

</body>



</html>
