<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox - JustifyContent</title>
</head>
<style>
    body {
        justify-content: center;
        align-items: center;
        display: flex;
    }
    
    .container {
        display: flex;
        flex-direction: column;
        background-color: yellow;
        height: 400px;
        width: 100%;
        align-items: center;
        justify-content: space-evenly;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
    }
    
    .container-2 {
        background-color: lightgreen;
        width: 300px;
        height: 75px;
        align-items: center;
        display: flex;
        gap: 10px;
        margin: 10px;
        padding: 10px;
    }
    
    .container-3 {
        display: flex;
        background-color: red;
        width: 50px;
        height: 50px;
    }
    
    .container-4 {
        display: flex;
        background-color: yellow;
        width: 50px;
        height: 50px;
    }
    
    .container-5 {
        display: flex;
        background-color: green;
        width: 50px;
        height: 50px;
    }
</style>

<body>

    <div class="container">

        <div class="container-2" style="        justify-content: flex-start;">

            <div class="container-3"></div>
            <div class="container-4"></div>
            <div class="container-5"></div>

        </div>

        <div class="container-2" style="        justify-content: flex-end;">
            <div class="container-3"></div>
            <div class="container-4"></div>
            <div class="container-5"></div>
        </div>

        <div class="container-2" style="        justify-content: center;">

            <div class="container-3"></div>
            <div class="container-4"></div>
            <div class="container-5"></div>

        </div>

        <div class="container-2" style="        justify-content: space-around;">

            <div class="container-3"></div>
            <div class="container-4"></div>
            <div class="container-5"></div>

        </div>

        <div class="container-2" style="        justify-content: space-between;">

            <div class="container-3"></div>
            <div class="container-4"></div>
            <div class="container-5"></div>

        </div>

        <div class="container-2" style="        justify-content: space-evenly;">

            <div class="container-3"></div>
            <div class="container-4"></div>
            <div class="container-5"></div>

        </div>
    </div>

</body>

</html>
