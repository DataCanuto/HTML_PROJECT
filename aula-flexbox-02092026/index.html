    .container {
        display: flex;
        background-color: blue;
        flex-wrap: wrap;
        justify-content: space-between;
        align-content: center;
        align-items: center;
        height: 600px;
    }
    
    .container div {
        background-color: azure;
        color: blue;
        width: 100px;
        margin: 10px;
        padding: 20px;
        text-align: center;
        font-size: 30px;
    }
</style>

<body>
    <div class="container">
        <div style="flex-grow: 1; height: 400px;">ITEM 1</div>
        <div style="flex-grow: 2;height: 200px;">ITEM 2</div>
        <div style="flex-grow: 4; height: 100px;">ITEM 3</div>
        <div style="flex-basis: 200px">ITEM 4</div>

    </div>

</body>
