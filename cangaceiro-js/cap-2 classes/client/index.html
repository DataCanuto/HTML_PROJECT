<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="../app/index.js" defer></script>
    <script src="../app/domain/negociacao/Negociacao.js"></script>
    <script src="../app/controllers/NegociacaoController.js"></script>
    <script>
        var n1 = new Negociacao();
        n1.data = new Date();
        n1.quantidade = 10;
        n1.valor = 200.50;

        var vol1 = n1.obterVolume();

        console.log(n1);
        console.log(vol1);

        var n2 = new Negociacao(new Date(), 15, 100);

        var vol2 = n2.obterVolume();
        console.log(n2);
        console.log(vol2);
    </script>



    <title>JS Intro</title>
</head>

<body>

    <h1>Formulário</h1>
    <form class="form">
        <div class="mb-3">
            <label for="data" class="form-label">Data</label>
            <input type="date" class="form-control" id="data" aria-describedby="dataHelp" required autofocus>

        </div>
        <div class="mb-3">
            <label for="quantidade" class="form-label">Quantidade</label>
            <input type="number" class="form-control" id="quantidade" min="1" step="1" value="1" required>
        </div>
        <div class="mb-3">
            <label for="valor" class="form-label">Valor</label>
            <input type="number" class="form-control" id="valor" min="0.01" step="0.01" value="0.00" required>
        </div>


        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <div class="text-center">
        <button id="btn-get-all" class="btn btn-primary text-center" type="button">Get All</button>

        <button id="btn-delete-all" class="btn btn-primary text-center" type="button">Delete</button>
    </div>

    <br>
    <br>

    <table class="table table-hover table-bordered">

        <thead>
            <tr>
                <th>DATA</th>
                <th>QUANTIDADE</th>
                <th>VALOR</th>
                <th>VOLUME</th>

            </tr>
        </thead>

        <tbody></tbody>

        <tfoot></tfoot>
    </table>

    
</body>

</html>
